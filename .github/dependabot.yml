version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/starters/*"]
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directories: ["/", "/shared/e2e", "/starters/*", "/starters/*/e2e"]
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: maven
    directory: /starters/spring-boot
    schedule: { interval: weekly }
    groups:
      maven: { patterns: ["*"] }
  - package-ecosystem: nuget
    directory: /starters/aspnet-core
    schedule: { interval: weekly }
    groups:
      nuget: { patterns: ["*"] }
