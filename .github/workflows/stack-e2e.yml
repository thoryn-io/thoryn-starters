# Run one starter end to end against staging, exactly as a generated repository would. Nothing is
# rendered: the starter's own .thoryn/ci steps run in place (starters/<stack>), and they get their wiring
# from the same THORYN_* environment a generated repository's workflow maps from its Actions variables:
#   THORYN_ISSUER         vars.THORYN_ISSUER
#   THORYN_WORKSPACE      vars.THORYN_STARTERS_WORKSPACE
#   THORYN_ENVIRONMENT    ci-<stack>
#   THORYN_WIF_CLIENT_ID  the stack's vars.THORYN_STARTERS_WIF_<STACK> (input wif-client-id)
# Then: workload identity sign-in, provision apply, start the app, the Playwright journey, teardown.
#
# Staging fixture (one-time setup, docs/staging-setup.md): workspace $THORYN_STARTERS_WORKSPACE, one
# sandbox `ci-<stack>` per stack, and in each a workload identity trust pinned to thoryn-io/thoryn-starters.
# Until those exist the job skips with a notice.
name: stack e2e

on:
  workflow_call:
    inputs:
      stack:
        description: Directory under starters/.
        type: string
        required: true
      wif-client-id:
        description: clientId (wi_…) of the staging trust for this stack; empty = skip.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  gate:
    name: configured?
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          WIF_CLIENT_ID: ${{ inputs.wif-client-id }}
          WORKSPACE: ${{ vars.THORYN_STARTERS_WORKSPACE }}
          THORYN_ISSUER: ${{ vars.THORYN_ISSUER }}
          FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if [ -z "$WIF_CLIENT_ID" ] || [ -z "$WORKSPACE" ] || [ -z "$THORYN_ISSUER" ]; then
            echo "::notice::Staging e2e for ${{ inputs.stack }} skipped: set THORYN_ISSUER, THORYN_STARTERS_WORKSPACE and the stack's THORYN_STARTERS_WIF_* variable (README.md, Staging CI)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$FORK" = "true" ]; then
            echo "::notice::Pull requests from forks get no GitHub OIDC token; staging e2e skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: provision + sign-in journey
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: starters-staging-e2e-${{ inputs.stack }}
      cancel-in-progress: false
    env:
      THORYN_ISSUER: ${{ vars.THORYN_ISSUER }}
      THORYN_WORKSPACE: ${{ vars.THORYN_STARTERS_WORKSPACE }}
      THORYN_ENVIRONMENT: ci-${{ inputs.stack }}
      THORYN_WIF_CLIENT_ID: ${{ inputs.wif-client-id }}
      # The client's display name (its converge key in the sandbox); a generated repository uses its name.
      THORYN_APP_NAME: thoryn-starters-${{ inputs.stack }}-ci
      THORYN_CLI_VERSION: ${{ vars.THORYN_CLI_VERSION }}
      GH_TOKEN: ${{ github.token }}
      REPO_DIR: ${{ github.workspace }}/starters/${{ inputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: inputs.stack == 'spring-boot'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - if: inputs.stack == 'aspnet-core'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: starters/aspnet-core/global.json
      - name: Install app dependencies
        if: inputs.stack == 'express'
        working-directory: ${{ env.REPO_DIR }}
        run: npm ci
      - name: Install the thoryn CLI
        working-directory: ${{ env.REPO_DIR }}
        run: .thoryn/ci/install-cli.sh
      - name: Sign in (workload identity) and provision the sandbox
        working-directory: ${{ env.REPO_DIR }}
        run: .thoryn/ci/provision.sh
      - name: Start the app
        working-directory: ${{ env.REPO_DIR }}
        run: .thoryn/ci/start-app.sh
      - name: Install Playwright
        working-directory: ${{ env.REPO_DIR }}/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Sign-in journey
        working-directory: ${{ env.REPO_DIR }}/e2e
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ inputs.stack }}
          path: |
            ${{ env.REPO_DIR }}/e2e/playwright-report
            ${{ env.REPO_DIR }}/e2e/test-results
            ${{ env.REPO_DIR }}/app.log
          retention-days: 7
      - name: Remove what this run created
        if: always()
        working-directory: ${{ env.REPO_DIR }}
        run: .thoryn/ci/teardown.sh
