# What this application owns in Thoryn — converged by `thoryn provision apply --file .thoryn/provision.yaml`.
#
# An APPLICATION project declares only its own OAuth client and its own sandbox test user. The environment
# and all workspace-wide sign-in configuration (login methods, branding, email, custom domain) belong to the
# workspace's CONFIG project, never to an application.
#
# Nothing here is specific to one repository: the `thoryn` CLI fills in every `{{env.NAME}}` from the
# environment when it reads the file.
#   THORYN_ENVIRONMENT        the sandbox (a GitHub Actions variable in CI; export it locally)
#   THORYN_APP_NAME           the client's display name, its converge key in the sandbox; .thoryn/ci/provision.sh
#                             defaults it to the repository name
#   THORYN_TEST_USER_EMAIL    the test user; CI creates a fresh one per run and deletes it afterwards
#   THORYN_TEST_USER_PASSWORD (read through `passwordEnv`, never written anywhere)
apiVersion: thoryn.io/provision/v1
resources:
  - kind: application
    name: web
    environment: "{{env.THORYN_ENVIRONMENT}}"
    spec:
      displayName: "{{env.THORYN_APP_NAME}}"
      clientType: public                  # server-side app, but no secret to store: PKCE proves the client
      grantTypes: ["authorization_code"]
      scopes: ["openid", "profile", "email"]
      # Local development (a SANDBOX client only; never register these on production):
      #  - http://127.0.0.1/…: RFC 8252 loopback URIs; the platform ignores their port, so any port works.
      #    This is what the app uses by default (it listens on and redirects to http://127.0.0.1:8080).
      #  - http://localhost:8080/…: `localhost` is a name, so the platform matches it exactly, port
      #    included. Use it with APP_BASE_URL=http://localhost:8080 (the app's default port and paths).
      # Add your deployed https URLs next to these when you deploy the app.
      redirectUris:
        - "http://127.0.0.1/callback"
        - "http://localhost:8080/callback"
      postLogoutRedirectUris:
        - "http://127.0.0.1/signed-out"
        - "http://localhost:8080/signed-out"

  - kind: user
    name: test-user
    environment: "{{env.THORYN_ENVIRONMENT}}"
    spec:
      email: "{{env.THORYN_TEST_USER_EMAIL}}"
      passwordEnv: THORYN_TEST_USER_PASSWORD
      givenName: "Test"
      familyName: "User"
      emailVerified: true
