# Build, test, provision the sandbox and run the sign-in journey — with no stored secret.
#
# The Thoryn jobs sign in with WORKLOAD IDENTITY: GitHub gives each job a short-lived OIDC token, and the
# workspace's trust for this repository exchanges it for a Thoryn token (`.thoryn/connection.json`).
# Repository variable: THORYN_ISSUER (the platform base issuer, e.g. https://auth.stg.thoryn.org).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test --solution ThorynStarter.slnx

  thoryn:
    name: Thoryn configured?
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          THORYN_ISSUER: ${{ vars.THORYN_ISSUER }}
          FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if [ -f .thoryn/template.json ]; then
            echo "::notice::This is the unrendered starter template; the Thoryn jobs run once the repository is created from it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$THORYN_ISSUER" ]; then
            echo "::notice::Set the THORYN_ISSUER repository variable to run the Thoryn jobs."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$FORK" = "true" ]; then
            echo "::notice::Pull requests from forks get no GitHub OIDC token; the Thoryn jobs are skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Provision sandbox + sign-in e2e
    needs: [build, thoryn]
    if: needs.thoryn.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request its own OIDC token: the only credential it has
    # provision.yaml converges the same client; never let two runs create and delete it under each other.
    concurrency:
      group: thoryn-sandbox-e2e-${{ github.repository }}
      cancel-in-progress: false
    env:
      THORYN_ISSUER: ${{ vars.THORYN_ISSUER }}
      THORYN_CLI_VERSION: ${{ vars.THORYN_CLI_VERSION }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the thoryn CLI
        run: .thoryn/ci/install-cli.sh
      - name: Sign in (workload identity) and provision the sandbox
        run: .thoryn/ci/provision.sh
      - name: Start the app
        run: .thoryn/ci/start-app.sh
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Sign-in journey
        working-directory: e2e
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            app.log
          retention-days: 7
      - name: Remove what this run created
        if: always()
        run: .thoryn/ci/teardown.sh
