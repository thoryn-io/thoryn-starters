# PRODUCTION section of the workspace's TENANT provisioning (oauthy ADR 2026-10-25, provisioning is tenant and
# applications). This config project is the ONE place that defines what the tenant IS: its environments, identity
# sources (federationMember), users (sandbox test users included), sign-in (loginMethods, loginFlow, loginTheme),
# email provider and email templates, custom domain, roles, and the workload identity trusts of the workspace's app
# projects.
# Applications are USERS of the tenant: each app project declares its own OAuth client in its own
# thoryn.io/application/v1 file — never here. The engine refuses `kind: application` in this file.
#
# THIS FILE STARTS WITH ONLY WHAT THE SETUP CREATED (SSO-3993): the sandbox environment. Merging the setup pull request
# changes nothing in your workspace. What the workspace already has — its login methods, branding, email provider,
# identity providers, custom domain, roles, trusts — arrives through a separate IMPORT pull request that Thoryn opens
# after the setup is merged ("Thoryn: your workspace's current configuration", whose plan shows every row unchanged;
# a new workspace has nothing more to import). Where the Thoryn GitHub App does not open it yet, render it yourself:
# `thoryn provision import --file .thoryn/environments/production/provision.yaml`. The commented examples below are the
# shapes you add yourself from then on.
#
# Converged by the production connection (.thoryn/environments/production/connection.json, seeded with the repository:
# this repository's own workload identity, which signs in to the production plane only from the reviewed GitHub
# environment `thoryn-production` on main). The provisioning stub (.github/workflows/thoryn-provisioning.yml, dispatched
# by the Thoryn GitHub App) plans it on every pull request and applies it on main; `.thoryn/workflow.yaml` lists the files.
# The production connection holds read and write for every tenant kind, so nothing below needs a new scope.
# `thoryn project init config` replaces this file with one naming your sandbox literally.
#
# Resources without `environment:` live on the production plane. No secrets in this file: name the environment
# variable that carries one (`smtpPasswordEnv`, `clientSecretEnv`). `{{env.NAME}}` is filled in by the `thoryn` CLI
# from the environment when it reads the file — in CI from the `env:` block of .thoryn/workflow.yaml.
apiVersion: thoryn.io/tenant/v1
resources:
  # The sandbox the setup created (or the one you chose). Declared by its slug only, so the first apply changes
  # nothing — not even its display name. Each sandbox also has its own section under .thoryn/environments/.
  # `retain: true` — mine, keep: `destroy` and `--prune` never remove it (ADR 2026-10-15, the platform is the ledger).
  - kind: environment
    name: sandbox
    retain: true
    spec:
      slug: "{{env.THORYN_SANDBOX_ENVIRONMENT}}"

  # ── Examples. The import pull request fills in what your workspace already has; remove the leading `#` to add more ──
  #
  # How people sign in on production (tenant:idp.*):
  # - kind: loginMethods
  #   spec:
  #     methods: ["password", "passkey"]
  #
  # Branding of the hosted sign-in pages (tenant:idp.*). The spec is the WHOLE branding record: a field you do not
  # declare is CLEARED on apply (the plan shows it as `→ (cleared)`), and `cssVariables` is replaced as one map. So
  # declare every field you want kept. Colours are CSS hex; text and button colours must meet WCAG AA contrast.
  # - kind: loginTheme
  #   spec:
  #     logoUrl: "https://www.example.com/logo.svg"
  #     primaryColor: "#3d5afe"
  #     backgroundColor: "#ffffff"
  #     borderRadiusPx: 8
  #     theme: "auto"
  #     cssVariables:
  #       "--thoryn-accent": "#3d5afe"
  #       "--thoryn-text": "#1a1a1a"
  #       "--thoryn-muted": "#5f6368"
  #       "--thoryn-font-family": "Inter, Arial, sans-serif"
  #
  # Your own wording for the sign-in-link email, in English and Dutch (tenant:idp.*). One entry per template type and
  # language; omit `locale` for the base template. Templates belong to the WORKSPACE, so no `environment:` (one set
  # for every environment). A body may use only its type's variables; for magic_link those are {{magicLinkUrl}},
  # {{displayName}} and {{expiryMinutes}}. The example bodies sit in emails/examples/ next to this file, apart from
  # emails/<type>.html and emails/<type>.<locale>.html, where `thoryn provision import` writes the bodies it imports
  # (the import never overwrites a different file there). Uncomment as is, or move the bodies into emails/ and
  # update `bodyFile`.
  # - kind: emailTemplate
  #   name: magic-link
  #   spec:
  #     type: magic_link
  #     locale: en
  #     subject: "Your sign-in link"
  #     bodyFile: emails/examples/magic_link.html
  # - kind: emailTemplate
  #   name: magic-link-nl
  #   spec:
  #     type: magic_link
  #     locale: nl
  #     subject: "Je inloglink"
  #     bodyFile: emails/examples/magic_link.nl.html
  #
  # Your own SMTP server for production email (tenant:email.*). The password comes from the SMTP_PASSWORD environment
  # variable, never from this file. (The import renders an existing provider `readOnly: true`: the provisioning workflow
  # carries no secrets, so a person takes it over when the password has to change.)
  # - kind: emailProvider
  #   spec:
  #     smtpHost: "smtp.example.com"
  #     smtpPort: 587
  #     smtpUsername: "thoryn"
  #     smtpPasswordEnv: SMTP_PASSWORD
  #     transportSecurity: "STARTTLS"
  #     fromAddress: "no-reply@example.com"
  #     fromName: "Example"
  #
  # A customer identity provider (tenant:federation.*):
  # - kind: federationMember
  #   name: corporate-idp
  #   spec:
  #     providerType: oidc
  #     displayName: "Corporate sign-in"
  #     discoveryUrl: "https://login.example.com/.well-known/openid-configuration"
  #     clientId: "thoryn"
  #     clientSecretEnv: CORPORATE_IDP_CLIENT_SECRET
  #
  # A role your applications map into tokens (tenant:roles.*):
  # - kind: role
  #   name: support
  #   spec:
  #     description: "Support staff"
  #     permissions: ["tickets:read", "tickets:write"]
  #
  # Sign-in on your own domain (tenant:domains.*). Applications need no change when it becomes active: they resolve
  # their issuer at run time.
  # - kind: customDomain
  #   spec:
  #     host: "auth.example.com"
  #
  # Another sandbox (tenant:environments.*): production creates it. See README.md, "Another sandbox".
  # - kind: environment
  #   name: staging
  #   spec:
  #     slug: "staging"
  #     displayName: "Staging"
