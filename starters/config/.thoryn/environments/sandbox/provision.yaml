# SANDBOX section of the workspace configuration — planned on every pull request and applied on every push
# to main, signed in with this sandbox's workload identity trust (connection `sandbox` in
# .thoryn/template.json). The sandbox is the THORYN_SANDBOX_ENVIRONMENT Actions variable; the `thoryn` CLI
# fills in `{{env.THORYN_SANDBOX_ENVIRONMENT}}` from the environment when it reads the file.
#
# A sandbox never sends email: it captures it in its test inbox (`thoryn env test-emails`), so there is no
# emailProvider here. The environment itself is declared in the production section.
#
# To add another sandbox, see "Another sandbox" in the README.
apiVersion: thoryn.io/provision/v1
resources:
  # Offer every method in the sandbox so developers can try them before production does.
  - kind: loginMethods
    environment: "{{env.THORYN_SANDBOX_ENVIRONMENT}}"
    spec:
      methods: ["password", "passkey", "magic_code", "magic_link"]

