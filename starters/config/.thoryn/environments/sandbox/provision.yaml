# SANDBOX section of the workspace's TENANT provisioning (oauthy ADR 2026-10-25): what the sandbox IS — its sign-in
# configuration, its test users, its roles, and the workload identity trusts of the app projects bound to it. The
# applications that USE the sandbox declare their own OAuth clients in their own thoryn.io/application/v1 files.
#
# THIS FILE STARTS WITH ONLY THE SANDBOX ITSELF (SSO-3993): merging the setup pull request changes nothing in your
# workspace. What the sandbox already has — its login methods, test users, roles — arrives through the separate IMPORT
# pull request Thoryn opens after the setup is merged (see the production section). The commented examples below are
# the shapes you add yourself from then on.
#
# Converged by the sandbox connection (.thoryn/environments/sandbox/connection.json, seeded with the repository: this
# repository's workload identity in the sandbox, manager of that sandbox alone; it holds read and write for every
# tenant kind). The sandbox is named by THORYN_SANDBOX_ENVIRONMENT, which the `thoryn` CLI fills in from the
# environment when it reads the file (in CI from the `env:` block of .thoryn/workflow.yaml). `thoryn project init
# config` replaces this file with one naming the sandbox literally.
#
# A sandbox never sends email: it captures it in its test inbox (`thoryn env test-emails`), so there is no
# emailProvider here.
apiVersion: thoryn.io/tenant/v1
resources:
  # The sandbox itself — the anchor its configuration hangs off. `readOnly: true`: a dependency, not this section's
  # (the production section declares it), so plan reads it and apply never writes it. Declared by its slug only.
  - kind: environment
    name: sandbox
    readOnly: true
    spec:
      slug: "{{env.THORYN_SANDBOX_ENVIRONMENT}}"

  # ── Examples. The import pull request fills in what your sandbox already has; remove the leading `#` to add more ──
  # Each one lives IN the sandbox: `environment: "{{env.THORYN_SANDBOX_ENVIRONMENT}}"`.
  #
  # Offer every method in the sandbox so developers can try them before production does (tenant:idp.*):
  # - kind: loginMethods
  #   environment: "{{env.THORYN_SANDBOX_ENVIRONMENT}}"
  #   spec:
  #     methods: ["password", "passkey", "magic_code", "magic_link"]
  #
  # Email templates (tenant:idp.*): the sandbox sends production's (see the emailTemplate examples in the production
  # section) until it declares its own. To try new wording here first, declare an emailTemplate in this file with
  # `environment: "{{env.THORYN_SANDBOX_ENVIRONMENT}}"` and its body file beside this file, apply, check the email in
  # the test inbox, then declare it in production's section.
  #
  # A sandbox TEST USER (tenant:users.*). An app project references it by email in its test configuration; it never
  # creates one. The password comes from an environment variable, never from this file.
  # - kind: user
  #   name: test-user
  #   environment: "{{env.THORYN_SANDBOX_ENVIRONMENT}}"
  #   spec:
  #     email: "test-user@example.com"
  #     passwordEnv: THORYN_TEST_USER_PASSWORD
  #     emailVerified: true
  #
  # An app project's CI identity in this sandbox (tenant:workload-identity.*): a repository never declares its own
  # trust, so the config project does. Its scopes: tenant:applications.read tenant:applications.write
  # tenant:access.read tenant:environments.read — and nothing wider.
  # - kind: workloadIdentityTrust
  #   name: my-app
  #   environment: "{{env.THORYN_SANDBOX_ENVIRONMENT}}"
  #   spec:
  #     provider: github_actions
  #     github:
  #       repository: "my-org/my-app"
  #     scopes: ["tenant:applications.read", "tenant:applications.write", "tenant:access.read", "tenant:environments.read"]
